# Cloud Build: build backend image, push to Artifact Registry, deploy to Cloud Run.
#
# Prerequisites:
# - Artifact Registry Docker repository (substitution _AR_REPO, e.g. videogame)
# - Cloud Run API enabled; service account can push to AR and deploy Cloud Run
# - Trigger: push to main, config = this file at repo root
#
# Build context is `backend/` so the Dockerfile can read pyproject.toml, uv.lock, and videogame_back/.

substitutions:
  _REGION: northamerica-south1
  _AR_REPO: devnexus-docker-repository
  _SERVICE_NAME: backend-api

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build-backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/videogame_back/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:latest
      - backend

  - id: push-backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --quiet
      # --- Console configurations ---
      - --allow-unauthenticated
      - --session-affinity                         # Necessary for WebSockets/Chat
      - --max-instances=1                          # Cost control
