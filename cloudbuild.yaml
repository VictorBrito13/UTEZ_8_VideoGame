# Cloud Build: backend Docker image -> Artifact Registry -> Cloud Run; frontend -> Firebase Hosting.
#
# Prerequisites:
# - Artifact Registry Docker repository (_AR_REPO)
# - Cloud Run + Firebase (same or linked GCP project; Hosting enabled in Firebase console)
# - Secret Manager secret `firebase-ci-token`: output of `firebase login:ci` (Firebase CLI)
# - Cloud Build SA: Secret Manager Secret Accessor on that secret; Firebase Hosting deploy rights
# - Trigger: push to main, use this file at repo root
#
# First-time Firebase token:
#   firebase login:ci
#   echo -n 'PASTE_TOKEN' | gcloud secrets create firebase-ci-token --data-file=-
# Grant: PROJECT_NUMBER@cloudbuild.gserviceaccount.com -> roles/secretmanager.secretAccessor

substitutions:
  _REGION: northamerica-south1
  _AR_REPO: devnexus-docker-repository
  _SERVICE_NAME: backend-api

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/firebase-ci-token/versions/latest
      env: FIREBASE_TOKEN

steps:
  # Backend image (parallel with frontend install/build)
  - id: build-backend-image
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - backend/videogame_back/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:latest
      - backend

  - id: build-frontend
    name: node:22
    waitFor: ["-"]
    dir: frontend/videogame_front
    entrypoint: bash
    args:
      - -c
      - npm ci && npm run build

  - id: push-backend-image
    name: gcr.io/cloud-builders/docker
    waitFor: [build-backend-image]
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-backend-image]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --quiet
      # --- Console configurations ---
      - --allow-unauthenticated
      - --session-affinity
      - --max-instances=1

  - id: deploy-firebase-hosting
    name: node:22
    waitFor: [build-frontend]
    entrypoint: bash
    args:
      - -c
      # Trim FIREBASE_TOKEN: Secret Manager values often have a trailing newline; that breaks the Bearer header (OAuth 400).
      # Recreate secret with: echo -n 'TOKEN' | gcloud secrets versions add firebase-ci-token --data-file=-
      # Single -c script; $$ → $ for shell (secret from secretEnv).
      - >-
        set -eo pipefail &&
        test -f frontend/videogame_front/dist/index.html &&
        npm install -g firebase-tools@13.29.3 &&
        FB_TOKEN="$(printf '%s' "$$FIREBASE_TOKEN" | tr -d '\n\r')" &&
        firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive --token "$$FB_TOKEN"
    secretEnv: [FIREBASE_TOKEN]
