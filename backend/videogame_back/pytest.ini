[pytest]
DJANGO_SETTINGS_MODULE = videogame_back.settings
python_files = tests.py test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --cov=.
    --cov-report=xml
    --cov-report=html
    --cov-report=term-missing:skip-covered
    --cov-config=.coveragerc
    -v
    --tb=short
testpaths = .
junit_family = xunit2

