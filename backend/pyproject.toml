[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.3",
    "channels>=4.0.0",
    "dotenv>=0.9.9",
    "gunicorn>=25.3.0",
    "mysqlclient>=2.2.8",
    "pydantic>=2.0",
    "daphne>=4.2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 80
indent-width = 2

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = []
